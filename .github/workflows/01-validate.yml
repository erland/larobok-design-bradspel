name: Validate

on:
  pull_request:
    paths:
      - "chapters/**"
      - "docs/**"
      - "assets/**"
      - "exercises/**"
      - "examples/**"
      - "publishing/**"
      - "scripts/**"
      - "README.md"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "chapters/**"
      - "docs/**"
      - "assets/**"
      - "exercises/**"
      - "examples/**"
      - "publishing/**"
      - "scripts/**"
      - "README.md"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate project
        run: python3 scripts/validate_project.py .
